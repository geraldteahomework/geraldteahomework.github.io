<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n-doc="app.signin">Homework — sign in</title>
<meta name="theme-color" content="#4f6df5">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./style.css">
<style>
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .login { width: min(380px, 100%); text-align: center; }
  .login .logo { width: 56px; height: 56px; font-size: 30px; border-radius: 16px; margin: 0 auto 12px; }
  .login h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .login form { text-align: left; margin-top: 18px; }
  .login button.primary { width: 100%; }
  .login input[type=password] { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; min-height: 48px; font-size: 1.05rem; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="card login">
    <div class="logo">✓</div>
    <h1 data-i18n="app.name">Homework</h1>
    <p class="muted" id="hint" data-i18n="Loading…">Loading…</p>
    <form id="form" hidden>
      <label id="l1"><span data-i18n="Password">Password</span> <input id="pw" type="password" autocomplete="current-password" required minlength="6" autofocus></label>
      <label id="l2" hidden><span data-i18n="Repeat password">Repeat password</span> <input id="pw2" type="password" autocomplete="new-password" minlength="6"></label>
      <button type="submit" class="primary" id="btn" data-i18n="Sign in">Sign in</button>
      <p id="err" class="status err"></p>
    </form>
  </div>
</div>
<script src="./site.js"></script>
<script src="./i18n.js"></script>
<script>
(async () => {
  const $ = s => document.querySelector(s);
  applyLanguage();
  let setup = false;
  await initSite();
  if (HOSTED && !API_BASE) { $('#hint').textContent = t('Cannot find the Pi right now. Is it switched on? Try again in a minute.'); return; }
  try {
    const a = await apiFetch('/api/auth', { headers: apiHeaders(), cache: 'no-store' }).then(r => r.json());
    if (a.language && a.language !== LANG) { setLang(a.language); applyLanguage(); }
    if (a.authed) { location.replace(appUrl()); return; }
    setup = a.setup;
  } catch { $('#hint').textContent = t('Cannot reach the server.'); return; }
  $('#hint').textContent = setup ? t('First time here. Choose a password — you\'ll use it on every device, once.') : t('Enter the password to open your homework.');
  $('#l2').hidden = !setup;
  $('#pw').autocomplete = setup ? 'new-password' : 'current-password';
  $('#btn').textContent = setup ? t('Set password & continue') : t('Sign in');
  $('#form').hidden = false;
  $('#pw').focus();
  $('#form').addEventListener('submit', async e => {
    e.preventDefault();
    $('#err').textContent = '';
    const password = $('#pw').value;
    if (setup && password !== $('#pw2').value) { $('#err').textContent = t('Passwords don\'t match.'); return; }
    $('#btn').disabled = true;
    try {
      const r = await apiFetch(setup ? '/api/setup' : '/api/login', { method: 'POST', headers: apiHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify({ password }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || t('Failed'));
      if (d.token) setAuthToken(d.token);
      location.replace(appUrl());
    } catch (err) { $('#err').textContent = err.message; $('#btn').disabled = false; }
  });
})();
</script>
</body>
</html>
